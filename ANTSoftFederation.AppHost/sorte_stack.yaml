  sorte_designer_studio:
    image: registry.docker.bakelor.com/apps/sorte-designer-studio:latest
    container_name: sorte_designer_studio
    restart: always
    ports:
      - 10002:10002
    networks:
      - sorte
    volumes:
      - sorte_designer_studio_vol:/app/Contents/Data 
    environment:
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry
      - REGISTRY_AUTH_HTPASSWD_PATH=/bakelor/spRFcL63P
      - VIRTUAL_HOST=vipasx_events
      - ASPNETCORE_URLS=http://+:10002
      - VIRTUAL_PORT=10002
      - ConnectionStrings:DefaultConnection=Filename=./Contents/Data/sorteDesignStudio.db;
      - RabbitMQ:Host=localhost
      - RabbitMQ:Port=5672
      - RabbitMQ:Username=tps
      - RabbitMQ:Password=tpsy@z2023!
      - RabbitMQ:VirtualHost=/
      - RabbitMQ:Queues:Default:Durable=true
      - RabbitMQ:Queues:Default:Exclusive=false
      - RabbitMQ:Queues:Default:AutoDelete= false
      - RabbitMQ:Queues:DeadLetter:Durable=true
      - RabbitMQ:Queues:DeadLetter:Exclusive=false
      - RabbitMQ:Queues:DeadLetter:AutoDelete=false 
      - app:WaitingTime=2 
      - app:RefreshTimeIntervalInMinutes=2
      - app:DataFetchIntervalInMinutes=180 

