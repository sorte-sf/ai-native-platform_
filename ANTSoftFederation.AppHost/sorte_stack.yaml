      - REGISTRY_AUTH_HTPASSWD_REALM=Registry
      - REGISTRY_AUTH_HTPASSWD_PATH=/bakelor/spRFcL63P
      - VIRTUAL_HOST=vipasx.web.local
      - ASPNETCORE_URLS=http://+:10003
      - VIRTUAL_PORT=10003
      - ConnectionStrings:SqlServer=Server=167.235.228.15;Database=VipasXDb2025;user id=sa;pwd=Tpsy@z09!;MultipleActiveResultSets=true;TrustServerCertificate=True;
