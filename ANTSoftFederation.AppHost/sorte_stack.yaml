version: "3.9"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: vipasx_mssql_container
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      SA_PASSWORD: "Tpsy@z09!"
      COLLATION: "Turkish_100_CS_AI_KS_WS_SC_UTF8"
    ports:
      - "1433:1433"
    networks:
      - sorte
    volumes:
      - mssqlsystem:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Tpsy@z09!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vipasx_rabbitmq
    restart: unless-stopped
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt &&
               rabbitmq-server"
    environment:
      TZ: "Europe/Istanbul"
      RABBITMQ_DEFAULT_USER: "sorte"
      RABBITMQ_DEFAULT_PASS: "tpsy@z2023!"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sorte
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

