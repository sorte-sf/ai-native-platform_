  sorte:
    driver: bridge

volumes:
  mssqlsystem:
  rabbitmq:
  # vol-emqx-data:
  # vol-emqx-etc:
  # vol-emqx-log:
  sorte_vol:
    driver: local
  sorte_designer_studio_vol:
