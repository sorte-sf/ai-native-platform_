name: Build and Publish Builders Image

on:
  push:
    paths:
      - 'Api/ANTSoftFederation.Builders/**'
      - 'Api/ANTSoftFederation.EncryptEFCoreColumn/**'
      - 'Api/ANTSoftFederation.GlobalEnums/**'
      - 'Api/ANTSoftFederation.KeyVault/**'
      - 'Api/ANTSoftFederation.Logger/**'
      - 'Api/ANTSoftFederation.ServiceDefaults/**'
      - 'Api/ANTSoftFederation.Shared/**'
      - 'Clients/AntsoftBuilder/src/app/core/builders/page-components.v1.json'
      - '.github/workflows/builders-deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/antsoft-builders
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Api/ANTSoftFederation.Builders/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
