name: Builders CI

on:
  push:
    paths:
      - 'ANTSoftFederation.Builders/**'
      - 'ANTSoftFederation.EncryptEFCoreColumn/**'
      - 'ANTSoftFederation.GlobalEnums/**'
      - 'ANTSoftFederation.KeyVault/**'
      - 'ANTSoftFederation.Logger/**'
      - 'ANTSoftFederation.ServiceDefaults/**'
      - 'ANTSoftFederation.Shared/**'
      - '.github/workflows/builders-ci.yml'
      - '.github/workflows/builders-deploy.yml'
  pull_request:
    paths:
      - 'ANTSoftFederation.Builders/**'
      - 'ANTSoftFederation.EncryptEFCoreColumn/**'
      - 'ANTSoftFederation.GlobalEnums/**'
      - 'ANTSoftFederation.KeyVault/**'
      - 'ANTSoftFederation.Logger/**'
      - 'ANTSoftFederation.ServiceDefaults/**'
      - 'ANTSoftFederation.Shared/**'
      - '.github/workflows/builders-ci.yml'
      - '.github/workflows/builders-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ANTSoftFederation.Builders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SorteFederation.Builders.csproj
      - name: Build
        run: dotnet build SorteFederation.Builders.csproj --no-restore --configuration Release
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14
      - name: Generate Builder migration SQL
        env:
          Encryption__Key: 0123456789abcdef0123456789abcdef
          Auth__Jwt__Key: ci-only-jwt-signing-key-not-for-production
          ConnectionStrings__ANTPortalDb: Host=localhost;Port=5432;Database=builder_migrations;Username=ci;Password=ci
        run: dotnet ef migrations script --context BuilderDbContext --no-build --configuration Release --output "${RUNNER_TEMP}/builders-migrations.sql"
